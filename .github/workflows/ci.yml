name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一 ref の古い実行はキャンセルして無駄なランを減らす
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # NOTE: 学習用の小規模リポジトリのため、まずはパスフィルタ無しで両ジョブを常時実行する。
  # 将来 backend/frontend の変更に応じて分岐したい場合は dorny/paths-filter 等を検討。
  backend:
    name: backend (lint + import smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Import smoke test
        run: python -c "import app.main"

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
